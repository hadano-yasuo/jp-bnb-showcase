<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="skyC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#3d5a7c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#skyC)"/>
  <!-- rising sun -->
  <circle cx="352" cy="168" r="40" fill="#e8a04a"/>
  <!-- Mt. Fuji with subtle concave slopes -->
  <path d="M 60 380
           C 128 340, 190 258, 236 152
           L 276 152
           C 322 258, 384 340, 452 380 Z"
        fill="#0b1a2e"/>
  <!-- snow cap: geometric, 4-notch bottom edge -->
  <path d="M 210 214
           L 236 152 L 276 152 L 302 214
           L 288 202 L 274 218 L 258 204 L 244 218 L 232 204 L 218 216 Z"
        fill="#f7f3e8"/>
  <!-- ocean line + wave (Pan-Pacific) -->
  <g fill="none" stroke="#f7f3e8" stroke-linecap="round" opacity="0.5">
    <path d="M 76 400 L 436 400" stroke-width="1" opacity="0.35"/>
    <path d="M 80 418 Q 168 396 256 418 T 432 418" stroke-width="2"/>
  </g>
  <!-- caption -->
  <text x="256" y="460"
        text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="26" letter-spacing="14"
        fill="#f7f3e8" fill-opacity="0.78">JP-BNB</text>
</svg>
