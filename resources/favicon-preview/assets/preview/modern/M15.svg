<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#f2ecdc"/>
  <!-- day column dots (5 days) -->
  <g fill="#b0a480">
    <circle cx="112" cy="132" r="4"/>
    <circle cx="192" cy="132" r="4"/>
    <circle cx="272" cy="132" r="4"/>
    <circle cx="352" cy="132" r="4"/>
    <circle cx="432" cy="132" r="4"/>
  </g>
  <!-- subtle row separators -->
  <g stroke="#b0a480" stroke-width="1" opacity="0.35">
    <line x1="80" y1="180" x2="464" y2="180"/>
    <line x1="80" y1="244" x2="464" y2="244"/>
    <line x1="80" y1="308" x2="464" y2="308"/>
    <line x1="80" y1="372" x2="464" y2="372"/>
    <line x1="80" y1="436" x2="464" y2="436"/>
  </g>
  <!-- booking pills (reservations across days) -->
  <g>
    <rect x="88" y="196" width="220" height="32" rx="16" fill="#173049"/>
    <rect x="248" y="260" width="200" height="32" rx="16" fill="#f4a34c"/>
    <rect x="168" y="324" width="140" height="32" rx="16" fill="#173049" opacity="0.85"/>
    <rect x="384" y="388" width="64" height="32" rx="16" fill="#173049" opacity="0.55"/>
  </g>
</svg>
